name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The wiring test imports src/index.js, which needs the declared peer dependencies.
      - run: npm install --no-save --no-audit --no-fund
      - run: npm test
